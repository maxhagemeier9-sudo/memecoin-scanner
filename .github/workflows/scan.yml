name: Coin Risk Scan

on:
  schedule:
    # GitHub garantiert Minimum 5 Min, effektiv bei hoher Last auch spaeter
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: coin-risk-scan
  cancel-in-progress: false

# pages/id-token: fuer den offiziellen actions/deploy-pages-Ablauf (Dashboard,
# siehe docs/) - deployt per Artifact, nicht per Branch-Commit, damit die
# Git-Historie nicht mit einem Daten-Commit pro Scan (alle ~10 Min) zumuellt.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (fail fast statt kaputten Code zu scannen)
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pytest -q

      - name: Restore history DB from previous run
        uses: actions/cache/restore@v4
        with:
          path: history.sqlite3
          key: history-db-${{ github.run_id }}
          restore-keys: |
            history-db-

      - name: Run scan
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ci_scan.py

      - name: Paper-Trading-Report (nur zur Einsicht in den Logs)
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: python paper_trading.py

      - name: Dashboard-Daten exportieren
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: python dashboard_export.py

      - name: Dashboard-Pages-Artifact hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Dashboard auf GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save history DB for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: history.sqlite3
          key: history-db-${{ github.run_id }}
